services:
  postgres:
    image: postgres:16-alpine
    container_name: caimi-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: caimi
      POSTGRES_PASSWORD: caimi_dev_2026
      POSTGRES_DB: caimi_db

    ports:
      - "5433:5432"

    volumes:
      - caimi_postgres_data:/var/lib/postgresql/data

volumes:
  caimi_postgres_data: